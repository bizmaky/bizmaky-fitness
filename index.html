<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="manifest.webmanifest">
<title>Bizmaky Fitness</title>
<style>
:root{--navy:#101827;--blue:#dcecff;--ink:#172033;--muted:#687386;--bg:#f3f5f8;--card:#fff;--line:#e1e6ed;--green:#1f8f55;--orange:#c66a16;--red:#b94242}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
header{background:var(--navy);color:#fff;padding:22px 20px 20px}header h1{margin:0;font-size:28px}header p{margin:5px 0 0;color:#d6dce7;font-size:16px}
main{max-width:760px;margin:auto;padding:18px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:17px;background:#fff}.stat b{font-size:25px;display:block}.stat span{color:var(--muted);font-size:14px}
h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:15px 0 8px}.muted{color:var(--muted)}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:15px;background:#e9eef6;color:var(--ink);cursor:pointer}button.primary{background:var(--navy);color:#fff}button.good{background:#dff4e8;color:#176d40}button.warn{background:#fff0dd;color:#8a4b0d}button.danger{background:#fde4e4;color:#8f2d2d}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:13px}.pill{display:inline-block;background:#edf3ff;border-radius:999px;padding:5px 9px;font-size:13px}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item input{width:25px;height:25px;accent-color:var(--green);margin-top:1px}.item .txt{flex:1}.done{text-decoration:line-through;color:#7b8491}.kcal{font-size:13px;color:var(--muted);margin-top:3px}
select,input[type=number],input[type=text]{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:10px;background:#fff;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}nav button{background:#fff;border-radius:0;padding:11px 4px;font-size:12px;color:#667085}nav button.active{color:#245bb5;font-weight:800}
.dayrow{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.dayrow:last-child{border-bottom:0}
.progress{height:10px;background:#e5e9ef;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#2a6fc5}
.notice{background:#eef5ff;border:1px solid #d6e5ff;border-radius:14px;padding:12px;margin-bottom:14px}
.hidden{display:none!important}
dialog{border:0;border-radius:20px;max-width:680px;width:calc(100% - 28px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0008}.modal{padding:20px}.choice{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}
</style>
</head>
<body>
<header><h1>⚓ Bizmaky Fitness</h1><p>120 kg → 85 kg · 4-week rolling plan</p></header>
<main id="app"></main>
<nav>
<button data-tab="today">🏠<br>Today</button>
<button data-tab="diet">🥗<br>Diet</button>
<button data-tab="gym">🏋️<br>Gym</button>
<button data-tab="week">📅<br>Week</button>
<button data-tab="progress">📈<br>Progress</button>
</nav>

<dialog id="mealDialog"><div class="modal">
<div class="between"><h2 id="mealTitle">Meal</h2><button onclick="mealDialog.close()">✕</button></div>
<p class="muted small">Choose what you actually ate. The daily calorie estimate updates immediately.</p>
<div id="mealChoices"></div>
<button class="primary" style="width:100%;margin-top:8px" onclick="mealDialog.close();render()">Done</button>
</div></dialog>

<script>
const START="2026-08-17";
const meals={
 breakfast:{label:"Breakfast",choices:[
  ["Overnight oats + frozen fruit",430],["Eggs + toast + fruit",400],["Greek yoghurt + fruit + oats",380],["Custom",0]]},
 lunch:{label:"Lunch",choices:[
  ["Huel Black Edition — 1 serving",400],["Huel Ready-to-drink",400],["Chicken wrap + salad",500],["Soup + roll",420],["Custom",0]]},
 snack:{label:"Snack",choices:[
  ["Apple + 1 biscuit",180],["Banana + yoghurt",190],["Protein bar",200],["Fruit",100],["Custom",0]]},
 dinner:{label:"Dinner",choices:[
  ["Chicken + potato/rice + 2 veg",650],["Lean beef + potato/rice + 2 veg",700],["Fish + potato + veg",600],["Vegetarian chilli + rice",620],["Custom",0]]},
 huelHS:{label:"Huel H&S",choices:[
  ["Huel H&S — 1 serving",400],["Huel H&S — 1.5 servings",600],["Huel H&S — 2 servings",800],["Custom",0]]}
};
const gymPlan=[
 ["Monday","Strength A"],["Tuesday","Strength B"],["Wednesday","Rest / mobility"],["Thursday","Strength C"],["Friday","Optional cardio"],["Saturday","Rest / active"],["Sunday","Rest"]
];
let state=JSON.parse(localStorage.getItem("bizmakyFitnessV16")||"null")||{checks:{}, meals:{}, custom:{}, gym:{}, weight:120, tab:"today"};
function save(){localStorage.setItem("bizmakyFitnessV16",JSON.stringify(state))}
function dateObj(s){return new Date(s+"T12:00:00")}
function iso(d){return d.toISOString().slice(0,10)}
function mondayOf(d){let x=new Date(d);let n=x.getDay();let diff=(n+6)%7;x.setDate(x.getDate()-diff);return x}
function dayKey(d){return iso(d)}
function currentDate(){let d=new Date();let start=dateObj(START);return d<start?start:d}
function dayName(d){return d.toLocaleDateString("en-GB",{weekday:"long"})}
function weekDays(){
 let m=mondayOf(currentDate()), a=[];for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);a.push(d)}return a
}
function kcalFor(type){
 let key=dayKey(currentDate()), val=state.meals[key]?.[type];
 if(!val)return meals[type].choices[0][1];
 if(val.name==="Custom")return Number(val.kcal)||0;
 return val.kcal;
}
function selectedName(type){
 let key=dayKey(currentDate()), val=state.meals[key]?.[type];
 return val?.name || meals[type].choices[0][0];
}
function checklist(){
 let k=dayKey(currentDate());
 return [
  ["breakfast","Breakfast: "+selectedName("breakfast")],
  ["lunch","Lunch: "+selectedName("lunch")],
  ["snack","Snack: "+selectedName("snack")],
  ["dinner","Dinner: "+selectedName("dinner")],
  ["huelHS","Huel H&S: "+selectedName("huelHS")],
  ["water","Water / fluids"],
  ["gym","Gym / Navy Day / recovery"]
 ].map(([id,text])=>({id,text,done:!!state.checks[k+"_"+id]}));
}
function toggle(id){let k=dayKey(currentDate())+"_"+id;state.checks[k]=!state.checks[k];save();render()}
function setMeal(type,name,kcal){
 let k=dayKey(currentDate());state.meals[k]??={};state.meals[k][type]={name,kcal};save()
}
function openMeal(type){
 document.getElementById("mealTitle").textContent=meals[type].label;
 let box=document.getElementById("mealChoices");box.innerHTML="";
 meals[type].choices.forEach(([name,kcal])=>{
  let div=document.createElement("div");div.className="choice";
  div.innerHTML=`<div><b>${name}</b><div class="small muted">${kcal?`~${kcal} kcal`:"Enter your own calories"}</div></div><button ${name===selectedName(type)?'class="good"':''}>${name===selectedName(type)?"Selected":"Choose"}</button>`;
  div.querySelector("button").onclick=()=>{
   if(name==="Custom"){
    let x=prompt("What did you eat?"); if(x===null)return;
    let c=prompt("Approximate calories?"); if(c===null)return;
    setMeal(type,x,Number(c)||0);
   }else setMeal(type,name,kcal);
   openMeal(type);
  };box.appendChild(div)
 });
 document.getElementById("mealDialog").showModal()
}
function today(){
 let d=currentDate(), items=checklist(), done=items.filter(x=>x.done).length;
 let kcal=["breakfast","lunch","snack","dinner","huelHS"].reduce((a,t)=>a+kcalFor(t),0);
 app.innerHTML=`<div class="notice"><b>Test week starts Monday 17 August.</b><br><span class="small">Your routine matters more than perfection. On a rough Navy day, 30 minutes still counts.</span></div>
 <div class="card"><div class="between"><div><h2>Today — ${dayName(d)}</h2><div class="muted">Week of ${mondayOf(d).toLocaleDateString("en-GB")}</div></div><span class="pill">${done}/${items.length} complete</span></div></div>
 <div class="grid">
  <div class="stat"><b>${state.weight} kg</b><span>Current weight</span></div><div class="stat"><b>85 kg</b><span>Goal weight</span></div>
  <div class="stat"><b>1,900</b><span>Target kcal</span></div><div class="stat"><b>~${kcal}</b><span>Selected food kcal</span></div>
 </div>
 <div class="card"><div class="between"><h2>Today's checklist</h2><button class="small" onclick="resetToday()">Reset</button></div>
 ${items.map(x=>`<div class="item"><input type="checkbox" ${x.done?"checked":""} onchange="toggle('${x.id}')"><div class="txt ${x.done?"done":""}"><b>${x.text}</b>${["breakfast","lunch","snack","dinner","huelHS"].includes(x.id)?`<div class="kcal">${x.id==="huelHS"?"H&S can be used on its own. ":""}<button onclick="openMeal('${x.id}')" class="small">Change</button></div>`:""}</div></div>`).join("")}</div>
 <div class="card"><h2>Quick gym check</h2><p class="muted">You can complete a planned gym session on another day. No penalty for moving it.</p><div class="row"><button class="primary" onclick="navTo('gym')">Open Gym</button><button class="warn" onclick="navTo('gym')">⚓ Navy Day</button></div></div>`;
}
function diet(){
 let k=dayKey(currentDate()), kcal=["breakfast","lunch","snack","dinner","huelHS"].reduce((a,t)=>a+kcalFor(t),0);
 app.innerHTML=`<div class="card"><h2>🥗 Diet</h2><p class="muted">Pick what you actually ate. Nothing is locked in.</p><div class="stat"><b>~${kcal} kcal</b><span>Selected food for today · target 1,900</span></div></div>
 <div class="card"><h2>Meals</h2>${Object.keys(meals).map(t=>`<div class="item"><div class="txt"><b>${meals[t].label}</b><div class="kcal">${selectedName(t)} · ~${kcalFor(t)} kcal</div></div><button onclick="openMeal('${t}')">Change</button></div>`).join("")}</div>
 <div class="card"><h2>🍲 Huel H&S</h2><p class="muted">Huel H&S is separate from dinner, so you can choose it whenever you fancy it.</p><button class="primary" onclick="openMeal('huelHS')">Choose Huel H&S</button></div>`;
}
function gym(){
 let days=weekDays(), todayIso=dayKey(currentDate());
 let planned=days.filter((d,i)=>["Strength A","Strength B","Strength C"].includes(gymPlan[i][1]));
 let completed=Object.values(state.gym).filter(x=>x==="gym").length;
 app.innerHTML=`<div class="card"><h2>🏋️ Gym</h2><p class="muted">Three main sessions each week. If Monday doesn't happen, do it Tuesday — just tick the session when you complete it.</p><div class="stat"><b>${completed}/3</b><span>Main sessions completed this week</span></div></div>
 <div class="card"><h2>This week</h2>${days.map((d,i)=>{let key=dayKey(d), plan=gymPlan[i][1], status=state.gym[key]||"";
 return `<div class="dayrow"><b>${dayName(d).slice(0,3)}</b><div><b>${plan}</b><div class="small muted">${status==="gym"?"Completed":status==="navy"?"Navy Day completed":"Not completed"}</div></div><button class="${status?'good':'primary'}" onclick="gymDone('${key}', '${plan}')">${status?'✓ Done':'Complete'}</button></div>`}).join("")}</div>
 <div class="card"><h2>⚓ Navy Day</h2><p class="muted">For those post-duty days when you're absolutely shattered. A 30-minute session still keeps the routine alive.</p><button class="warn" onclick="navyDay('${todayIso}')">Record Navy Day today</button></div>`;
}
function gymDone(key,plan){state.gym[key]="gym";state.checks[key+"_gym"]=true;save();render()}
function navyDay(key){state.gym[key]="navy";state.checks[key+"_gym"]=true;save();render()}
function week(){
 let days=weekDays();let total=0,done=0;
 let rows=days.map((d,i)=>{let k=dayKey(d), items=["breakfast","lunch","snack","dinner","huelHS","water","gym"];let dn=items.filter(x=>state.checks[k+"_"+x]).length;total+=items.length;done+=dn;let g=state.gym[k]||"—";return `<div class="dayrow"><b>${dayName(d).slice(0,3)}</b><div><b>${dn}/${items.length} checklist</b><div class="small muted">Gym: ${g==="gym"?"✓":g==="navy"?"⚓ Navy Day":"—"}</div></div><span class="pill">${Math.round(dn/items.length*100)}%</span></div>`}).join("");
 app.innerHTML=`<div class="card"><h2>📅 Week overview</h2><p class="muted">${days[0].toLocaleDateString("en-GB")} – ${days[6].toLocaleDateString("en-GB")}</p><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div><p><b>${done}/${total}</b> checklist items complete</p></div><div class="card"><h2>Seven-day view</h2>${rows}</div>`;
}
function progress(){
 let days=weekDays();let gym=days.filter(d=>state.gym[dayKey(d)]==="gym").length;let navy=days.filter(d=>state.gym[dayKey(d)]==="navy").length;
 app.innerHTML=`<div class="card"><h2>📈 Progress</h2><p class="muted">Simple tracking for your test week.</p><div class="grid"><div class="stat"><b>${gym}</b><span>Gym sessions</span></div><div class="stat"><b>${navy}</b><span>Navy Days</span></div></div></div>
 <div class="card"><h2>Weight</h2><p class="muted">Update this whenever you weigh in.</p><input id="weight" type="number" step="0.1" value="${state.weight}"><button class="primary" style="margin-top:8px" onclick="setWeight()">Save weight</button></div>
 <div class="card"><h2>Reset test data</h2><p class="small muted">Use only if you want to start the test week again from scratch.</p><button class="danger" onclick="resetAll()">Reset app data</button></div>`;
}
function setWeight(){state.weight=Number(document.getElementById("weight").value)||state.weight;save();render()}
function resetToday(){let k=dayKey(currentDate());Object.keys(state.checks).filter(x=>x.startsWith(k+"_")).forEach(x=>delete state.checks[x]);delete state.meals[k];save();render()}
function resetAll(){if(confirm("Reset all saved app data?")){localStorage.removeItem("bizmakyFitnessV16");state={checks:{},meals:{},custom:{},gym:{},weight:120,tab:"today"};render()}}
function navTo(t){state.tab=t;save();render()}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));({today,diet,gym,week,progress}[state.tab]||today)()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>navTo(b.dataset.tab));
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
render();
</script>
</body></html>
