<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182536"><link rel="manifest" href="manifest.webmanifest"><title>FORCESFIT</title><style>
:root{--n:#182536;--bg:#f3eee3;--c:#fffdf7;--l:#d9d1c2;--m:#6e675c;--b:#40566b;--g:#456b53;--a:#a66a32;--r:#8d4038}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}header{background:var(--n);color:#fff;padding:16px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.brand img{width:42px;height:42px;border-radius:11px}.brand h1{margin:0;font-size:21px}.brand p{margin:2px 0 0;color:#cbd5e1;font-size:12px}main{max-width:820px;margin:auto;padding:15px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}h2{font-size:20px;margin:0 0 10px}.muted,.small{color:var(--m)}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid var(--l);border-radius:14px;padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--m)}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 12px;background:#e9e4d8;font-weight:700;color:#172033}button.primary{background:var(--n);color:#fff}button.good{background:#dff2e8;color:#17683f}button.warn{background:#fff0dc;color:#8a4e12}button.danger{background:#fde5e6;color:#8f3037}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.check{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--l);align-items:flex-start}.check input{width:24px;height:24px;accent-color:var(--g)}.day{display:grid;grid-template-columns:70px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.choice{border:1px solid var(--l);border-radius:12px;padding:12px;margin:8px 0}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eee8dc;font-size:12px}.positive{background:#eef1e8;border:1px solid #d6dfcf;border-radius:14px;padding:12px}.notice{background:#eef0eb;border:1px solid #d8ddd3;border-radius:14px;padding:12px}.progress{height:9px;background:#ded8cc;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--b)}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd4df;border-radius:10px;background:#fff}textarea{min-height:75px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(6,1fr);z-index:10}nav button{background:#fff;border-radius:0;padding:8px 2px;font-size:11px;color:#667085}nav button.active{color:var(--b);font-weight:800}dialog{border:0;border-radius:18px;width:min(700px,calc(100% - 20px));padding:0;box-shadow:0 20px 60px #0006}dialog::backdrop{background:#0008}.modal{padding:18px;max-height:88vh;overflow:auto}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}
</style></head><body><header><div class="brand"><img src="forcesfit-192.png?v=3"><div><h1>FORCESFIT</h1><p>Flexible fitness · nutrition · military life</p></div></div></header><main id="app"></main><nav><button data-t="today">🏠<br>Today</button><button data-t="diet">🥗<br>Diet</button><button data-t="gym">🏋️<br>Gym</button><button data-t="week">📅<br>Week</button><button data-t="progress">📈<br>Progress</button><button data-t="settings">⚙️<br>Settings</button></nav><dialog id="dlg"><div class="modal" id="mb"></div></dialog>
<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],CATS=['Breakfast','Lunch','Dinner','Snack'];
const MENU=[['Overnight oats + frozen fruit','Breakfast',430],['2 poached eggs + cooked tomatoes','Breakfast',260],['2 eggs + toast + tomatoes','Breakfast',380],['Porridge + fruit','Breakfast',350],['Cereal + milk + fruit','Breakfast',380],['Chicken + rice + vegetables','Dinner',650],['Fish + potatoes + vegetables','Dinner',600],['Roast dinner, sensible portions','Dinner',750],['Chicken curry + rice','Dinner',700],['Chilli + rice','Dinner',650],['Pasta + lean meat sauce','Dinner',680],['Jacket potato + tuna','Lunch',550],['Soup + bread roll','Lunch',420],['Chicken wrap + salad','Lunch',500],['Chicken/tuna sandwich + salad','Lunch',480],['Salad + lean protein','Lunch',450],['Apple + 1 biscuit','Snack',180],['Banana + yoghurt','Snack',190],['Grapes 150g','Snack',100],['Protein bar','Snack',200]].map((x,i)=>({id:'m'+i,name:x[0],cat:x[1],kcal:x[2]}));
const GALLEY=[['Poached eggs + cooked tomatoes','Breakfast',260],['2 eggs + toast + tomatoes','Breakfast',380],['Porridge + fruit','Breakfast',350],['Cereal + milk + fruit','Breakfast',380],['Cooked breakfast, sensible portions','Breakfast',550],['Chicken + rice','Lunch',550],['Jacket potato + tuna','Lunch',550],['Soup + roll','Lunch',420],['Chicken wrap + salad','Lunch',500],['Sandwich + salad','Lunch',480],['Chicken + potatoes + vegetables','Dinner',650],['Fish + potatoes + vegetables','Dinner',600],['Roast dinner, sensible portions','Dinner',750],['Chicken curry + rice','Dinner',700],['Chilli + rice','Dinner',650],['Pasta + meat sauce','Dinner',680],['Burger + chips','Dinner',900]].map((x,i)=>({id:'g'+i,name:x[0],cat:x[1],kcal:x[2]}));
const EX=[['Leg Press','Quads/Glutes','Machine',3,10],['Chest Press','Chest/Triceps','Machine',3,10],['Lat Pulldown','Back/Biceps','Machine',3,10],['Shoulder Press','Shoulders','Machine',3,10],['Leg Curl','Hamstrings','Machine',3,12],['Incline Dumbbell Press','Chest','Dumbbell',3,10],['Seated Cable Row','Back','Cable',3,10],['Lateral Raise','Shoulders','Dumbbell',3,12],['Biceps Curl','Biceps','Dumbbell',3,12],['Triceps Pushdown','Triceps','Cable',3,12],['Goblet Squat','Quads/Glutes','Dumbbell',3,10],['Bench Press','Chest/Triceps','Barbell',3,8],['Calf Raise','Calves','Machine',3,12],['Plank','Core','Bodyweight',3,30],['Easy Bike','Cardio','Bike',1,10],['Easy Incline Walk','Cardio','Treadmill',1,10]];
const RED=[['30-Minute Full Body','Light resistance + easy cardio',30,['Leg Press','Chest Press','Lat Pulldown','Shoulder Press','Easy Bike']],['Upper Body Light','Reduced-volume upper body',30,['Chest Press','Lat Pulldown','Shoulder Press','Biceps Curl','Triceps Pushdown']],['Lower Body Light','Light lower body',30,['Leg Press','Leg Curl','Calf Raise','Easy Bike']],['Cardio & Mobility','Easy cardio + movement',30,['Easy Bike','Easy Incline Walk','Plank']]];
function fresh(){return{v:3,tab:'today',s:{weight:120,goal:85,kcal:1900,gym:5,session:'60–90 min',experience:'Returning to gym',cardio:'Beginner',service:'Royal Navy',reduced:'Navy Day',reducedMins:30},menu:MENU,rep:[],days:{},weights:[],plan:null}}
let S=JSON.parse(localStorage.getItem('bizmakyFitnessV2')||'null')||fresh();function save(){localStorage.setItem('bizmakyFitnessV2',JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function today(){return new Date()}function iso(d){return d.toISOString().slice(0,10)}function monday(d){let x=new Date(d),n=x.getDay();x.setDate(x.getDate()-((n+6)%7));x.setHours(12);return x}function week(){let m=monday(today()),a=[];for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);a.push(d)}return a}function day(k){return S.days[k]??=({meals:{},checks:{},gym:null,extra:[],note:''})}function show(t,b){mb.innerHTML='<div class="between"><h2>'+t+'</h2><button onclick="dlg.close()">✕</button></div>'+b;dlg.showModal()}function nav(t){S.tab=t;save();render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.t));
function meal(k,cat){let d=day(k);if(d.meals[cat])return d.meals[cat];let idx=S.rep.find(r=>r.days[cat]?.includes(DAYS[(new Date(k+'T12:00:00').getDay()+6)%7]));if(idx)return{type:'rep',name:idx.brand+' '+idx.product,kcal:+idx.kcal,rep:idx.id};let p=S.plan?.diet?.[k]?.[cat];if(p)return p;let x=S.menu.find(m=>m.cat===cat);return{x:x?.id,name:x?.name||'Not set',kcal:x?.kcal||0,type:'menu'}}function consumed(k){let d=day(k);return CATS.reduce((n,c)=>n+(d.checks['meal_'+c]?+(meal(k,c)?.kcal||0):0),0)}
function todayPage(){let k=iso(today()),d=day(k),c=consumed(k),left=Math.max(0,S.s.kcal-c),count=CATS.filter(x=>d.checks['meal_'+x]).length+(d.checks.gym?1:0)+(d.checks.water?1:0);app.innerHTML=`<div class="notice"><b>Today — ${today().toLocaleDateString('en-GB',{weekday:'long'})}</b><br><span class="small">${count}/7 complete · Week overview updates automatically.</span></div><div class="grid"><div class="stat"><b>${S.s.weight.toFixed(1)} kg</b><span>Current weight</span><button onclick="edit('weight')">Edit</button></div><div class="stat"><b>${S.s.goal.toFixed(1)} kg</b><span>Goal weight</span><button onclick="edit('goal')">Edit</button></div><div class="stat"><b>${S.s.kcal}</b><span>Target kcal</span><button onclick="edit('kcal')">Edit</button></div><div class="stat"><b>${c}</b><span>Consumed kcal</span></div><div class="stat"><b>${left}</b><span>Remaining kcal</span></div><div class="stat"><b>${Math.round(c/S.s.kcal*100)}%</b><span>Target used</span></div></div><div class="card"><div class="between"><h2>Today's meals</h2><span class="badge">${c}/${S.s.kcal} kcal</span></div>${CATS.map(cat=>`<div class="check"><input type="checkbox" ${d.checks['meal_'+cat]?'checked':''} onchange="toggleMeal('${k}','${cat}')"><div style="flex:1"><b>${cat}</b><div>${esc(meal(k,cat).name)}</div><div class="small">~${meal(k,cat).kcal} kcal</div></div><button onclick="swap('${k}','${cat}')">🔄 Swap</button></div>`).join('')}</div><div class="card"><h2>🏋️ Today's training</h2><div class="row"><button class="primary" onclick="nav('gym')">Open Gym</button><button class="warn" onclick="reduced('${k}')">⚓ ${esc(S.s.reduced)}</button><button onclick="off('${k}')">💤 I'm having today off</button></div></div><div class="card"><h2>⚓ Galley Menu Guide</h2><p class="small">Rough calorie estimates; portions and cooking vary.</p><button class="primary" onclick="galley()">Open Galley Guide</button></div><div class="card"><h2>📝 Daily note</h2><textarea id="note">${esc(d.note)}</textarea><button class="primary" style="margin-top:8px" onclick="saveNote('${k}')">Save note</button></div>`}
function toggleMeal(k,c){day(k).checks['meal_'+c]=!day(k).checks['meal_'+c];save();render()}function saveNote(k){day(k).note=document.getElementById('note').value;save();render()}
function swap(k,c){show('🔄 Swap '+c,`<div class="choice"><b>1️⃣ Change meal</b><p class="small">Use your personal Menu Index.</p><button onclick="myMenu('${k}','${c}')">Open My Menu</button></div><div class="choice"><b>2️⃣ Manually change meal</b><p class="small">Enter a new meal and optionally save it.</p><button onclick="manual('${k}','${c}')">Manual entry</button></div><div class="choice"><b>3️⃣ Galley Index</b><p class="small">Browse galley choices.</p><button onclick="galley('${k}','${c}')">Open Galley Index</button></div>`)}
function myMenu(k,c){let a=S.menu.filter(x=>x.cat===c);show('👤 My Menu · '+c,`<input id="search" placeholder="Search..." oninput="filterMenu('${k}','${c}')"><div id="ml">${a.map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">~${x.kcal} kcal</div><button onclick="useMeal('${k}','${c}','${x.id}')">Use</button></div>`).join('')}</div><button onclick="addMenu()">➕ Add meal</button>`)}function filterMenu(k,c){let q=document.getElementById('search').value.toLowerCase();document.getElementById('ml').innerHTML=S.menu.filter(x=>x.cat===c&&x.name.toLowerCase().includes(q)).map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">~${x.kcal} kcal</div><button onclick="useMeal('${k}','${c}','${x.id}')">Use</button></div>`).join('')}function useMeal(k,c,id){let x=S.menu.find(a=>a.id===id);day(k).meals[c]={name:x.name,kcal:x.kcal,type:'menu',id};save();dlg.close();render()}
function manual(k,c){show('✏️ Manual '+c,`<label>Meal name<input id="mn"></label><br><label>Estimated kcal<input id="mk" type="number"></label><br><label><input id="ms" type="checkbox" checked> Save to My Menu</label><br><button class="primary" onclick="saveManual('${k}','${c}')">Use meal</button>`)}function saveManual(k,c){let n=mn.value.trim(),x=+mk.value||0;if(!n)return alert('Enter a meal name.');if(ms.checked)S.menu.push({id:'m'+Date.now(),name:n,cat:c,kcal:x});day(k).meals[c]={name:n,kcal:x,type:'manual'};save();dlg.close();render()}
function galley(k=null,c=null){let html='<p class="small">Galley calories are estimates.</p>';['Breakfast','Lunch','Dinner'].forEach(g=>{html+='<h3>'+g+'</h3>';GALLEY.filter(x=>x.cat===g).forEach(x=>html+=`<div class="choice"><b>${esc(x.name)}</b><div class="small">~${x.kcal} kcal</div>${k?`<button onclick="useGalley('${k}','${c||g}','${encodeURIComponent(x.name)}',${x.kcal})">Use</button>`:''}</div>`)});show('⚓ Galley Index',html)}function useGalley(k,c,n,x){day(k).meals[c]={name:decodeURIComponent(n),kcal:x,type:'galley'};save();dlg.close();render()}
function dietPage(){app.innerHTML=`<div class="card"><h2>🥗 Diet</h2><div class="grid"><div class="stat"><b>${S.s.kcal}</b><span>Daily target</span></div><div class="stat"><b>3</b><span>Main meals</span></div><div class="stat"><b>1</b><span>Snack</span></div></div></div><div class="card"><div class="between"><h2>🥤 Meal Replacements</h2><button onclick="addRep()">➕ Add</button></div>${S.rep.length?S.rep.map(r=>`<div class="choice"><b>${esc(r.brand)} ${esc(r.product)}</b><div class="small">${r.remaining}/${r.total} remaining · ${r.kcal} kcal/serving</div><div class="small">${Object.entries(r.days||{}).filter(([c,a])=>a.length).map(([c,a])=>c+': '+a.join(', ')).join(' · ')||'Not scheduled'}</div><button onclick="editRep('${r.id}')">Edit</button></div>`).join(''):'<p class="muted">No meal replacements configured.</p>'}</div><div class="card"><h2>🍽️ Menu & Planning</h2><div class="row"><button onclick="menuIndex()">My Menu Index</button><button onclick="galley()">Galley Index</button></div></div><div class="card"><h2>🤖 Auto-generate</h2><p class="small">Meal replacements are placed first; your menu fills the remaining meals.</p><button class="primary" onclick="genDiet()">Generate 4-week diet</button></div>`}
function addRep(old=null){let r=old||{id:'r'+Date.now(),brand:'',product:'',kcal:400,total:0,remaining:0,days:{Breakfast:[],Lunch:[],Dinner:[]}};let ds=c=>DAYS.map(d=>`<label style="margin-right:7px"><input class="rd" data-c="${c}" value="${d}" type="checkbox" ${(r.days[c]||[]).includes(d)?'checked':''}>${d.slice(0,3)}</label>`).join('');show('🥤 Meal Replacement',`<label>Brand<input id="rb" value="${esc(r.brand)}"></label><br><label>Product<input id="rp" value="${esc(r.product)}"></label><br><label>Calories per serving<input id="rk" type="number" value="${r.kcal}"></label><br><label>Total servings<input id="rt" type="number" value="${r.total}"></label><h3>Schedule</h3>${['Breakfast','Lunch','Dinner'].map(c=>'<b>'+c+'</b><div>'+ds(c)+'</div><br>').join('')}<button class="primary" onclick="saveRep('${r.id}')">Save</button>`)}function saveRep(id){let old=S.rep.find(r=>r.id===id),r={id,brand:rb.value.trim(),product:rp.value.trim(),kcal:+rk.value||0,total:+rt.value||0,remaining:old?Math.max(0,(+rt.value||0)-(old.total-old.remaining)):(+rt.value||0),days:{Breakfast:[],Lunch:[],Dinner:[]}};document.querySelectorAll('.rd:checked').forEach(x=>r.days[x.dataset.c].push(x.value));if(!r.brand||!r.product)return alert('Enter brand and product.');if(old)S.rep=S.rep.map(x=>x.id===id?r:x);else S.rep.push(r);save();dlg.close();render()}function editRep(id){addRep(S.rep.find(x=>x.id===id))}
function menuIndex(){show('👤 My Menu Index',`<input id="is" placeholder="Search..." oninput="renderMI()"><div id="mi"></div><button onclick="addMenu()">➕ Add meal</button>`);renderMI()}function renderMI(){let q=(is?.value||'').toLowerCase();mi.innerHTML=S.menu.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">${x.cat} · ~${x.kcal} kcal</div><div class="row"><button onclick="editMenu('${x.id}')">Edit</button><button class="danger" onclick="delMenu('${x.id}')">Delete</button></div></div>`).join('')}function addMenu(x=null){x=x||{id:'m'+Date.now(),name:'',cat:'Dinner',kcal:500};show('🍽️ Menu item',`<label>Name<input id="an" value="${esc(x.name)}"></label><br><label>Category<select id="ac">${CATS.map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></label><br><label>Calories<input id="ak" type="number" value="${x.kcal}"></label><br><button class="primary" onclick="saveMenu('${x.id}')">Save</button>`)}function saveMenu(id){let x={id,name:an.value.trim(),cat:ac.value,kcal:+ak.value||0};if(!x.name)return;if(S.menu.some(a=>a.id===id))S.menu=S.menu.map(a=>a.id===id?x:a);else S.menu.push(x);save();dlg.close();menuIndex()}function editMenu(id){addMenu(S.menu.find(x=>x.id===id))}function delMenu(id){if(confirm('Delete this meal?')){S.menu=S.menu.filter(x=>x.id!==id);save();renderMI()}}
function gymPage(){let ds=week(),p=S.plan;app.innerHTML=`<div class="card"><h2>🏋️ Gym</h2><p class="muted">Tap View workout to see the actual routine and checklist.</p><div class="grid"><div class="stat"><b>${S.s.gym}</b><span>Target sessions</span></div><div class="stat"><b>${ds.filter(d=>day(iso(d)).gym==='full').length}</b><span>Full sessions</span></div><div class="stat"><b>${ds.filter(d=>day(iso(d)).gym==='reduced').length}</b><span>${esc(S.s.reduced)}</span></div></div></div><div class="card"><h2>This week</h2>${ds.map((d,i)=>{let k=iso(d),st=day(k).gym,name=p?.gym?.[k]?.name||['Strength A','Strength B','Full Body','Conditioning','Strength C'][i];return `<div class="day"><b>${DAYS[i].slice(0,3)}</b><div><b>${name}</b><div class="small">${st==='full'?'✓ Full workout':st==='reduced'?'⚓ '+esc(S.s.reduced):st==='off'?'💤 Day off':'Not completed'}</div></div><button onclick="workout('${k}',${i})">View workout</button></div>`}).join('')}</div><div class="card"><h2>🤖 Auto-generate</h2><p class="small">Create 4 weeks from your current training preferences.</p><button class="primary" onclick="genGym()">Generate 4-week gym plan</button></div>`}
function exFor(i){let sets=[['Leg Press','Chest Press','Lat Pulldown','Shoulder Press','Easy Bike'],['Leg Curl','Incline Dumbbell Press','Seated Cable Row','Lateral Raise','Easy Incline Walk'],['Goblet Squat','Bench Press','Lat Pulldown','Biceps Curl','Triceps Pushdown'],['Leg Press','Chest Press','Seated Cable Row','Calf Raise','Plank'],['Leg Curl','Incline Dumbbell Press','Shoulder Press','Dead Bug','Easy Bike']];return sets[i%sets.length].map(n=>{let e=EX.find(x=>x[0]===n);return e?[e[0],e[3],e[4]]:[n,3,10]})}
function workout(k,i){let d=day(k),ex=S.plan?.gym?.[k]?.ex||exFor(i),done=d.wdone||{};let rows=ex.map((e,j)=>`<div class="check"><input type="checkbox" ${done[j]?'checked':''} onchange="toggleEx('${k}',${j},${ex.length})"><div><b>${esc(e[0])}</b><div class="small">${e[1]} sets × ${e[2]} reps/min</div></div></div>`).join('');show('🏋️ '+esc(S.plan?.gym?.[k]?.name||'Gym Session'),`<p class="small">Complete all required items; the final one marks the gym session complete.</p>${rows}<div class="row"><button onclick="reduced('${k}')">⚓ ${esc(S.s.reduced)}</button><button onclick="extra('${k}')">➕ Add extra</button><button onclick="off('${k}')">💤 Today off</button></div>`)}function toggleEx(k,j,total){let d=day(k);d.wdone??={};d.wdone[j]=!d.wdone[j];if(Object.values(d.wdone).filter(Boolean).length===total)d.gym='full';save();workout(k,0)}function extra(k){show('➕ Extra exercise',`<label>Exercise<select id="ee">${EX.map(x=>`<option>${esc(x[0])}</option>`).join('')}</select></label><br><label>Sets<input id="es" type="number" value="3"></label><br><label>Reps/min<input id="er" type="number" value="10"></label><button class="primary" onclick="saveExtra('${k}')">Add</button>`)}function saveExtra(k){day(k).extra.push({name:ee.value,sets:+es.value,reps:+er.value});save();dlg.close();render()}
function reduced(k){let html=RED.map((r,i)=>`<div class="choice"><b>⚓ ${esc(r[0])}</b><div class="small">${esc(r[1])} · ${r[2]} min</div><button class="warn" onclick="startRed('${k}',${i})">Choose</button></div>`).join('');show('⚓ Choose '+esc(S.s.reduced),html+`<button onclick="addReduced()">➕ Create reduced workout</button>`)}function startRed(k,i){let r=RED[i];day(k).red={name:r[0],items:r[3],done:{}};redWorkout(k,r)}function redWorkout(k,r){let d=day(k),done=d.red.done,rows=r[3].map((n,i)=>`<div class="check"><input type="checkbox" ${done[i]?'checked':''} onchange="toggleRed('${k}',${i},${r[3].length},${RED.indexOf(r)})"><div><b>${esc(n)}</b><div class="small">Light / reduced effort</div></div></div>`).join('');show('⚓ '+esc(S.s.reduced)+' · '+esc(r[0]),rows+`<button onclick="extra('${k}')">➕ Add extra exercise</button>`)}function toggleRed(k,i,total,ri){let d=day(k);d.red.done[i]=!d.red.done[i];if(Object.values(d.red.done).filter(Boolean).length===total)d.gym='reduced';save();redWorkout(k,RED[ri])}function addReduced(){alert('In V2.1 we can make the Reduced Workout Library fully editable. For now the starter library is ready to test.')}function off(k){day(k).gym='off';day(k).checks.gym=false;save();dlg.close();render()}
function genGym(){let n=S.s.gym,days=n===5?[0,1,2,3,4]:n===4?[0,1,3,5]:n===3?[0,2,4]:[1,4];let html=`<div class="notice">${n} training days + ${7-n} rest days each week.</div><p>Suggested training days: ${days.map(i=>DAYS[i]).join(' · ')}</p><p class="small">The first generated block uses varied strength sessions and keeps reduced-workout options available.</p><button class="primary" onclick='acceptGym(${JSON.stringify(days)})'>Accept plan</button>`;show('🤖 Gym Plan Preview',html)}function acceptGym(days){S.plan??={name:'Current 4-Week Plan',diet:{},gym:{}};for(let w=0;w<4;w++)for(let i=0;i<7;i++){let d=new Date(monday(today()));d.setDate(d.getDate()+w*7+i);let k=iso(d);if(days.includes(i))S.plan.gym[k]={name:['Strength A','Strength B','Full Body','Conditioning','Strength C'][days.indexOf(i)%5],ex:exFor(days.indexOf(i))}}save();dlg.close();nav('gym')}
function genDiet(){let need=S.rep.map(r=>{let n=Object.values(r.days||{}).reduce((a,x)=>a+x.length,0)*4;return`${esc(r.brand)} ${esc(r.product)}: ${n} required / ${r.remaining} available`}).join('<br>')||'No meal replacements configured.';show('🤖 Diet Plan Preview',`<div class="notice">Scheduled replacements are placed first; the Menu Index fills the remaining meals.</div><p>${need}</p><p>Target: <b>${S.s.kcal} kcal/day</b>.</p><button class="primary" onclick="acceptDiet()">Accept plan</button>`)}function acceptDiet(){S.plan??={name:'Current 4-Week Plan',diet:{},gym:{}};for(let w=0;w<4;w++)for(let i=0;i<7;i++){let d=new Date(monday(today()));d.setDate(d.getDate()+w*7+i);let k=iso(d);S.plan.diet[k]={};CATS.forEach(c=>{let r=S.rep.find(x=>x.days[c]?.includes(DAYS[i]));if(r)S.plan.diet[k][c]={name:r.brand+' '+r.product,kcal:+r.kcal,type:'rep',rep:r.id};else{let pool=S.menu.filter(x=>x.cat===c);if(pool.length){let x=pool[(w*7+i)%pool.length];S.plan.diet[k][c]={name:x.name,kcal:x.kcal,type:'menu',id:x.id}}}})}save();dlg.close();nav('diet')}
function weekPage(){let ds=week(),kg=0,full=0,red=0;let rows=ds.map((d,i)=>{let k=iso(d),x=day(k),c=consumed(k),ok=c>0&&c<=S.s.kcal;if(ok)kg++;if(x.gym==='full')full++;if(x.gym==='reduced')red++;return`<div class="day"><b>${DAYS[i].slice(0,3)}</b><div>🔥 Kcal ${c?(ok?'✅ Within target':'⚠️ Over target'):'— Not logged'}<br>🏋️ Gym ${x.gym==='full'?'✅ Full':x.gym==='reduced'?'⚓ '+esc(S.s.reduced):x.gym==='off'?'💤 Day off':'—'}<br>⚓ Reduced ${x.gym==='reduced'?'✅ Used':'—'}</div><span class="badge">${Object.values(x.checks).filter(Boolean).length}/7</span></div>`}).join('');app.innerHTML=`<div class="card"><h2>📅 Week Overview</h2><div class="grid"><div class="stat"><b>${kg}/7</b><span>Days within kcal</span></div><div class="stat"><b>${full}/${S.s.gym}</b><span>Full gym sessions</span></div><div class="stat"><b>${red}</b><span>${esc(S.s.reduced)} used</span></div></div></div><div class="card"><h2>Daily overview</h2>${rows}</div><div class="positive"><b>⭐ Weekly reflection</b><p>${weekMsg(full,red,kg)}</p></div>`}function weekMsg(full,red,kg){if(full>=S.s.gym)return'Great week — you hit your planned full training target. Keep that consistency going.';if(full+red>=S.s.gym)return'You adapted well this week and kept your training frequency going, including reduced sessions when needed.';if(kg>=5)return'Your nutrition was consistent on most days. One imperfect day does not undo the work you have put in.';return'This is a learning week. You kept showing up where you could; use what you learned to make the next week easier.'}
function progressPage(){let last=S.weights.length?S.weights[S.weights.length-1].weight:S.s.weight,first=S.weights.length?S.weights[0].weight:S.s.weight,diff=first-last,ds=week(),full=ds.filter(d=>day(iso(d)).gym==='full').length,red=ds.filter(d=>day(iso(d)).gym==='reduced').length;app.innerHTML=`<div class="card"><h2>📈 Progress</h2><div class="grid"><div class="stat"><b>${last.toFixed(1)} kg</b><span>Current weight</span></div><div class="stat"><b>${S.s.goal.toFixed(1)} kg</b><span>Target weight</span></div><div class="stat"><b>${diff>=0?'−':'+'}${Math.abs(diff).toFixed(1)} kg</b><span>Since first weigh-in</span></div></div><button class="primary" style="margin-top:10px" onclick="addWeight()">⚖️ Add new weight</button></div><div class="card"><h2>🏋️ Gym progress</h2><div class="grid"><div class="stat"><b>${full}/${S.s.gym}</b><span>Full sessions</span></div><div class="stat"><b>${red}</b><span>${esc(S.s.reduced)}</span></div><div class="stat"><b>${S.weights.length}</b><span>Weigh-ins</span></div></div></div><div class="positive"><b>⭐ Progress so far</b><p>${progressMsg(first,last)}</p></div><div class="card"><h2>Weight history</h2>${S.weights.length?S.weights.map(w=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--l)"><span>${new Date(w.date).toLocaleDateString('en-GB')}</span><b>${w.weight.toFixed(1)} kg</b></div>`).join(''):'<p class="muted">No weigh-ins yet. Add one when you are ready, especially at the end of a four-week cycle.</p>'}</div>`}function progressMsg(a,b){if(!S.weights.length)return'Your first weigh-in will give us a useful starting point. The bigger goal is building a routine you can keep.';if(b<a)return`You are ${ (a-b).toFixed(1)} kg down since your first weigh-in. That is movement in the right direction — keep focusing on consistency.`;if(b===a)return`Your weight is steady so far, but you are building the habits that matter. The scale is only one measure of progress.`;return`The scale is up ${ (b-a).toFixed(1)} kg since the first entry. Keep working the routine and review the trend rather than judging one measurement.`}function addWeight(){show('⚖️ Add new weight',`<p class="small">A simple weigh-in at the end of a four-week cycle is enough if that suits you.</p><input id="nw" type="number" step="0.1" value="${S.s.weight}"><button class="primary" onclick="saveWeight()">Save weight</button>`)}function saveWeight(){let w=+nw.value;if(!w)return;S.weights.push({date:iso(today()),weight:w});S.s.weight=w;save();dlg.close();render()}
function settingsPage(){let s=S.s;app.innerHTML=`<div class="card"><h2>⚙️ Settings</h2><p class="muted">Your control centre for goals, training, service settings and four-week plans.</p></div><div class="card"><h2>🎯 My Goals</h2><div class="row"><button onclick="edit('weight')">Current ${s.weight.toFixed(1)} kg</button><button onclick="edit('goal')">Goal ${s.goal.toFixed(1)} kg</button><button onclick="edit('kcal')">${s.kcal} kcal/day</button></div></div><div class="card"><h2>🏋️ Training Preferences</h2><div class="row"><button onclick="edit('gym')">${s.gym} days/week</button><button onclick="edit('session')">${esc(s.session)}</button><button onclick="edit('experience')">${esc(s.experience)}</button><button onclick="edit('cardio')">${esc(s.cardio)} cardio</button></div></div><div class="card"><h2>⚓ Service / Reduced Workout</h2><label>Service<select onchange="S.s.service=this.value;save();render()"><option ${s.service==='Royal Navy'?'selected':''}>Royal Navy</option><option ${s.service==='Royal Air Force'?'selected':''}>Royal Air Force</option><option ${s.service==='British Army'?'selected':''}>British Army</option><option ${s.service==='Other'?'selected':''}>Other</option></select></label><br><label>Reduced workout name<input value="${esc(s.reduced)}" onchange="S.s.reduced=this.value||'Reduced Day';save();render()"></label><br><label>Default duration<input type="number" value="${s.reducedMins}" onchange="S.s.reducedMins=+this.value||30;save()"></label><p class="small">Examples: Navy Day, RAF Day, Army Day, Duty Day, Light Day.</p></div><div class="card"><h2>🥗 Diet Preferences</h2><p>Main meals: <b>3</b> · Snacks: <b>1</b></p><button onclick="nav('diet')">Manage meal replacements & menus</button></div><div class="card"><h2>📋 Four-Week Plans</h2><p>${S.plan?'Current plan created':'No current plan yet'}</p><div class="row"><button onclick="genDiet()">🤖 Generate diet</button><button onclick="genGym()">🤖 Generate gym</button></div></div><div class="card"><h2>💾 Backup & Data</h2><div class="row"><button onclick="exportData()">📤 Export</button><button onclick="importData()">📥 Import</button><button class="danger" onclick="resetData()">Reset app</button></div></div><div class="card"><h2>ℹ️ About</h2><p class="small">FORCESFIT V3 · configurable fitness, nutrition and progress tracking.</p></div>`}
function edit(f){let map={weight:['Current weight','number'],goal:['Goal weight','number'],kcal:['Daily calorie target','number'],gym:['Gym days per week','number'],session:['Preferred session','text'],experience:['Training experience','text'],cardio:['Cardio ability','text']},x=map[f],v=S.s[f];show('⚙️ '+x[0],`<input id="ev" type="${x[1]}" value="${esc(v)}"><button class="primary" onclick="saveEdit('${f}')">Save</button>`)}function saveEdit(f){let v=ev.value;S.s[f]=['weight','goal','kcal'].includes(f)||['gym'].includes(f)?+v:v;save();dlg.close();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='forcesfit-backup.json';a.click()}function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Backup imported.')}catch(e){alert('Invalid backup.')}};r.readAsText(i.files[0])};i.click()}function resetData(){if(confirm('Reset all app data on this device?')){S=fresh();save();render()}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===S.tab));({today:todayPage,diet:dietPage,gym:gymPage,week:weekPage,progress:progressPage,settings:settingsPage}[S.tab]||todayPage)()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw-v3.js').catch(()=>{});render();
</script></body></html>
