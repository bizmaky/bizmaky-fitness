function renderMealMenu(k,c){let q=(miq?.value||'').toLowerCase();mealml.innerHTML=S.menu.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">${x.cat} · ~${x.kcal} kcal</div><button onclick="addMenuItemToMeal('${k}','${c}','${x.id}')">Add</button></div>`).join('')}

function mealManualItem(k,c){show('✏️ Manual addition',`<label>Item name<input id="ain"></label><br><label>Calories<input id="aik" type="number"></label><br><label><input id="ais" type="checkbox" checked> Save to My Menu</label><br><button class="primary" onclick="saveMealItem('${k}','${c}')">Add item</button>`)}
function saveMealItem(k,c){let n=ain.value.trim(),x=+aik.value||0;if(!n)return alert('Enter an item name.');if(ais.checked)S.menu.push({id:'m'+Date.now(),name:n,cat:c,kcal:x});let items=mealItems(meal(k,c)).slice();items.push({name:n,kcal:x});day(k).meals[c]=mealFromItems(items,'adjusted');save();dlg.close();render()}
function mealAdjustItems(k,c){let items=mealItems(meal(k,c));show('⚙️ Adjust '+c,`<div class="row"><button onclick="foodAddToMeal('${k}','${c}')">🥕 Add from Food Index</button><button onclick="mealAddFromMenu('${k}','${c}')">📋 Add from My Menu</button><button onclick="mealManualItem('${k}','${c}')">✏️ Manual addition</button></div><div id="adjustItems">${items.map((x,i)=>`<div class="choice"><div class="between"><b>${esc(x.name)}</b><span>~${x.kcal} kcal</span></div><div class="row"><button onclick="removeMealItem('${k}','${c}',${i})">Remove</button><button onclick="editMealItem('${k}','${c}',${i})">Edit</button></div></div>`).join('')}</div><button class="primary" onclick="dlg.close();render()">Done</button>`)}function foodAddToMeal(k,c){show('🥕 Add food to '+c,`<input id="afq" placeholder="Search food..." oninput="renderFoodMeal('${k}','${c}')"><div id="foodMealList"></div>`);renderFoodMeal(k,c)}function renderFoodMeal(k,c){let q=(afq?.value||'').toLowerCase();foodMealList.innerHTML=S.food.filter(x=>(x.name+' '+x.cat+' '+x.unit).toLowerCase().includes(q)).map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">${esc(x.unit)} · ~${x.kcal} kcal</div><button onclick="addFoodItemToMeal('${k}','${c}','${x.id}')">Add</button></div>`).join('')}function addFoodItemToMeal(k,c,id){let x=S.food.find(a=>a.id===id),items=mealItems(meal(k,c)).slice();items.push({name:x.name+' ('+x.unit+')',kcal:+x.kcal});day(k).meals[c]=mealFromItems(items);save();mealAdjustItems(k,c)}
function removeMealItem(k,c,i){let items=mealItems(meal(k,c)).slice();items.splice(i,1);day(k).meals[c]=mealFromItems(items);save();mealAdjustItems(k,c)}
function editMealItem(k,c,i){let x=mealItems(meal(k,c))[i];show('✏️ Edit item',`<label>Name<input id="ein" value="${esc(x.name)}"></label><br><label>Calories<input id="eik" type="number" value="${x.kcal}"></label><br><button class="primary" onclick="saveMealItemEdit('${k}','${c}',${i})">Save</button>`)}
function saveMealItemEdit(k,c,i){let items=mealItems(meal(k,c)).slice();items[i]={name:ein.value.trim(),kcal:+eik.value||0};day(k).meals[c]=mealFromItems(items);save();mealAdjustItems(k,c)}
function galley(k=null,c=null){let html='<p class="small">Galley calories are estimates. You can add or edit items in the Galley Index.</p><input id="gq" placeholder="Search galley..." oninput="renderGalley()"><div id="galleyList"></div><div class="row"><button onclick="addGalley()">➕ Add item</button></div>';show('⚓ Galley Index',html);renderGalley(k,c)}function renderGalley(k,c){let q=(gq?.value||'').toLowerCase();galleyList.innerHTML=S.galley.filter(x=>(x.name+' '+x.cat).toLowerCase().includes(q)).map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">${x.cat} · ~${x.kcal} kcal</div><div class="row">${k?`<button onclick="useGalley('${k}','${c||x.cat}','${encodeURIComponent(x.name)}',${x.kcal})">Use</button>`:''}<button onclick="editGalley('${x.id}')">Edit</button><button class="danger" onclick="delGalley('${x.id}')">Delete</button></div></div>`).join('')}function useGalley(k,c,n,x){day(k).meals[c]={name:decodeURIComponent(n),kcal:x,type:'galley',items:[{name:decodeURIComponent(n),kcal:x}]};save();dlg.close();render()}function addGalley(x=null){x=x||{id:'g'+Date.now(),name:'',cat:'Dinner',kcal:500};show('⚓ Galley item',`<label>Name<input id="gn" value="${esc(x.name)}"></label><br><label>Category<select id="gc">${['Breakfast','Lunch','Dinner'].map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></label><br><label>Calories<input id="gk" type="number" value="${x.kcal}"></label><br><button class="primary" onclick="saveGalley('${x.id}')">Save</button>`)}function saveGalley(id){let x={id,name:gn.value.trim(),cat:gc.value,kcal:+gk.value||0};if(!x.name)return;if(S.galley.some(a=>a.id===id))S.galley=S.galley.map(a=>a.id===id?x:a);else S.galley.push(x);save();dlg.close();galley()}function editGalley(id){addGalley(S.galley.find(x=>x.id===id))}function delGalley(id){if(confirm('Delete this galley item?')){S.galley=S.galley.filter(x=>x.id!==id);save();renderGalley()}}function dietPage(){app.innerHTML=`<div class="card"><h2>🥗 Diet</h2><div class="grid"><div class="stat"><b>${S.s.kcal}</b><span>Daily target</span></div><div class="stat"><b>3</b><span>Main meals</span></div><div class="stat"><b>1</b><span>Snack</span></div></div></div><div class="card"><div class="between"><h2>🥤 Meal Replacements</h2><button onclick="addRep()">➕ Add</button></div>${S.rep.length?S.rep.map(r=>`<div class="choice"><b>${esc(r.brand)} ${esc(r.product)}</b><div class="small">${r.remaining}/${r.total} remaining · ${r.kcal} kcal/serving</div><div class="small">${Object.entries(r.days||{}).filter(([c,a])=>a.length).map(([c,a])=>c+': '+a.join(', ')).join(' · ')||'Not scheduled'}</div><button onclick="editRep('${r.id}')">Edit</button></div>`).join(''):'<p class="muted">No meal replacements configured.</p>'}</div><div class="card"><h2>🍽️ Menu & Planning</h2><p class="small">Starting databases are preloaded and editable on this device.</p><div class="row"><button onclick="menuIndex()">My Menu Index</button><button onclick="galley()">Galley Index</button><button onclick="foodIndex()">Food Index</button></div></div><div class="card"><h2>🤖 Auto-generate</h2><p class="small">Meal replacements are placed first; the generator selects meals from My Menu.</p><button class="primary" onclick="genDiet()">Generate 4-week diet</button></div>`}function addRep(old=null){let r=old||{id:'r'+Date.now(),brand:'',product:'',kcal:400,total:0,remaining:0,days:{Breakfast:[],Lunch:[],Dinner:[]}};let ds=c=>DAYS.map(d=>`<label style="margin-right:7px"><input class="rd" data-c="${c}" value="${d}" type="checkbox" ${(r.days[c]||[]).includes(d)?'checked':''}>${d.slice(0,3)}</label>`).join('');show('🥤 Meal Replacement',`<label>Brand<input id="rb" value="${esc(r.brand)}"></label><br><label>Product<input id="rp" value="${esc(r.product)}"></label><br><label>Calories per serving<input id="rk" type="number" value="${r.kcal}"></label><br><label>Total servings<input id="rt" type="number" value="${r.total}"></label><h3>Schedule</h3>${['Breakfast','Lunch','Dinner'].map(c=>'<b>'+c+'</b><div>'+ds(c)+'</div><br>').join('')}<button class="primary" onclick="saveRep('${r.id}')">Save</button>`)}function saveRep(id){let old=S.rep.find(r=>r.id===id),r={id,brand:rb.value.trim(),product:rp.value.trim(),kcal:+rk.value||0,total:+rt.value||0,remaining:old?Math.max(0,(+rt.value||0)-(old.total-old.remaining)):(+rt.value||0),days:{Breakfast:[],Lunch:[],Dinner:[]}};document.querySelectorAll('.rd:checked').forEach(x=>r.days[x.dataset.c].push(x.value));if(!r.brand||!r.product)return alert('Enter brand and product.');if(old)S.rep=S.rep.map(x=>x.id===id?r:x);else S.rep.push(r);save();dlg.close();render()}function editRep(id){addRep(S.rep.find(x=>x.id===id))}
function menuIndex(){show('👤 My Menu Index',`<p class="small">${S.menu.length} meals available. Add your own at any time.</p><input id="is" placeholder="Search meals..." oninput="renderMI()"><div id="mi"></div><button onclick="addMenu()">➕ Add meal</button>`);renderMI()}function renderMI(){let q=(is?.value||'').toLowerCase();mi.innerHTML=S.menu.filter(x=>(x.name+' '+x.cat).toLowerCase().includes(q)).map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">${x.cat} · ~${x.kcal} kcal</div><div class="row"><button onclick="editMenu('${x.id}')">Edit</button><button class="danger" onclick="delMenu('${x.id}')">Delete</button></div></div>`).join('')}function addMenu(x=null){x=x||{id:'m'+Date.now(),name:'',cat:'Dinner',kcal:500};show('🍽️ Menu item',`<label>Name<input id="an" value="${esc(x.name)}"></label><br><label>Category<select id="ac">${CATS.map(c=>`<option ${c===x.cat?'selected':''}>${c}</option>`).join('')}</select></label><br><label>Calories<input id="ak" type="number" value="${x.kcal}"></label><br><button class="primary" onclick="saveMenu('${x.id}')">Save</button>`)}function saveMenu(id){let x={id,name:an.value.trim(),cat:ac.value,kcal:+ak.value||0};if(!x.name)return;if(S.menu.some(a=>a.id===id))S.menu=S.menu.map(a=>a.id===id?x:a);else S.menu.push(x);save();dlg.close();menuIndex()}function editMenu(id){addMenu(S.menu.find(x=>x.id===id))}function delMenu(id){if(confirm('Delete this meal?')){S.menu=S.menu.filter(x=>x.id!==id);save();renderMI()}}function foodIndex(){show('🥕 Food Index',`<p class="small">${S.food.length} common foods. Search or scroll, then edit the database as needed.</p><input id="fq" placeholder="Search foods..." oninput="renderFoodIndex()"><div id="foodList"></div><button onclick="addFood()">➕ Add food</button>`);renderFoodIndex()}function renderFoodIndex(){let q=(fq?.value||'').toLowerCase();foodList.innerHTML=S.food.filter(x=>(x.name+' '+x.cat+' '+x.unit).toLowerCase().includes(q)).map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">${esc(x.cat)} · ${esc(x.unit)} · ~${x.kcal} kcal</div><div class="row"><button onclick="editFood('${x.id}')">Edit</button><button class="danger" onclick="delFood('${x.id}')">Delete</button></div></div>`).join('')}function addFood(x=null){x=x||{id:'f'+Date.now(),name:'',cat:'Other',unit:'1 serving',kcal:100};show('🥕 Food item',`<label>Name<input id="fn" value="${esc(x.name)}"></label><br><label>Category<input id="fc" value="${esc(x.cat)}"></label><br><label>Serving / unit<input id="fu" value="${esc(x.unit)}"></label><br><label>Calories<input id="fk" type="number" value="${x.kcal}"></label><br><button class="primary" onclick="saveFood('${x.id}')">Save</button>`)}function saveFood(id){let x={id,name:fn.value.trim(),cat:fc.value.trim()||'Other',unit:fu.value.trim()||'1 serving',kcal:+fk.value||0};if(!x.name)return;if(S.food.some(a=>a.id===id))S.food=S.food.map(a=>a.id===id?x:a);else S.food.push(x);save();dlg.close();foodIndex()}function editFood(id){addFood(S.food.find(x=>x.id===id))}function delFood(id){if(confirm('Delete this food item?')){S.food=S.food.filter(x=>x.id!==id);save();renderFoodIndex()}}function gymPage(){let ds=week(),p=S.plan;app.innerHTML=`<div class="card"><h2>🏋️ Gym</h2><p class="muted">Tap View workout to see the actual routine and checklist.</p><div class="grid"><div class="stat"><b>${S.s.gym}</b><span>Target sessions</span></div><div class="stat"><b>${ds.filter(d=>day(iso(d)).gym==='full').length}</b><span>Full sessions</span></div><div class="stat"><b>${ds.filter(d=>day(iso(d)).gym==='reduced').length}</b><span>${esc(S.s.reduced)}</span></div></div></div><div class="card"><h2>This week</h2>${ds.map((d,i)=>{let k=iso(d),st=day(k).gym,name=p?.gym?.[k]?.name||['Strength A','Strength B','Full Body','Conditioning','Strength C'][i];return `<div class="day"><b>${DAYS[i].slice(0,3)}</b><div><b>${name}</b><div class="small">${st==='full'?'✓ Full workout':st==='reduced'?'⚓ '+esc(S.s.reduced):st==='off'?'💤 Day off':'Not completed'}</div></div><button onclick="workout('${k}',${i})">View workout</button></div>`}).join('')}</div><div class="card"><h2>⚓ Service Day Library</h2><p class="small">Choose from 10 service-day routines for your selected service.</p><button class="warn" onclick="serviceWorkoutIndex()">Open Service Day Workouts</button></div><div class="card"><h2>🤖 Auto-generate</h2><p class="small">Create 4 weeks from your current training preferences.</p><button class="primary" onclick="genGym()">Generate 4-week gym plan</button></div><div class="card"><h2>📚 Gym Workout Library</h2><p class="small">Manage your saved routines and the exercise index.</p><button onclick="gymLibrary()">Open Gym Workout Library</button></div>`}
function gymLibrary(){show('📚 Gym Workout Library',`<p class="small">50 seeded routines per ability level and focus, plus your own saved workouts.</p><div class="row"><button class="primary" onclick="myGym()">1. My Gym</button><button onclick="newGymWorkout()">2. Make new workout</button><button class="danger" onclick="removeGymWorkout()">3. Remove workout</button><button onclick="exerciseIndex()">Exercise Index</button><button onclick="serviceWorkoutIndex()">⚓ Service Day</button></div>`)}function myGym(){show('👤 My Gym',`<input id="wgq" placeholder="Search workouts..." oninput="renderMyGym()"><div class="row"><select id="wgl" onchange="renderMyGym()"><option>All levels</option>${Object.keys(EXERCISE_SEED).map(x=>`<option>${x}</option>`).join('')}</select><select id="wgt" onchange="renderMyGym()"><option>All types</option><option>Gym</option><option>Cardio</option></select></div><div id="myGymList"></div>`);renderMyGym()}function renderMyGym(){let q=(wgq?.value||'').toLowerCase(),lev=wgl?.value||'All levels',typ=wgt?.value||'All types';let arr=(S.workouts||[]).filter(w=>(w.name+' '+(w.level||'')+' '+(w.type||'')).toLowerCase().includes(q)&&(lev==='All levels'||w.level===lev)&&(typ==='All types'||w.type===typ));myGymList.innerHTML=arr.map(w=>`<div class="choice"><b>${esc(w.name)}</b><div class="small">${esc(w.type||'Gym')} · ${w.duration||60} min · ${esc(w.level||'Intermediate')}</div><button onclick="viewSavedWorkoutById('${w.id}')">View</button></div>`).join('')||'<p class="muted">No workouts match your search.</p>'}function viewSavedWorkoutById(id){let w=S.workouts.find(x=>x.id===id);if(w)viewSavedWorkout(S.workouts.indexOf(w))}function viewSavedWorkout(i){let w=S.workouts[i];show('🏋️ '+esc(w.name),`<p class="small">${esc(w.type||'Gym')} · ${w.duration||60} minutes · ${esc(w.level||'Intermediate')}</p>`+w.ex.map(e=>`<div class="check"><div><b>${esc(e.name)}</b><div class="small">${e.sets} sets × ${e.reps} reps/min</div></div></div>`).join(''))}function newGymWorkout(){show('➕ Make new workout',`<label>Name<input id="wn" placeholder="e.g. Upper Body A"></label><br><label>Type<select id="wt"><option>Gym</option><option>Cardio</option></select></label><br><label>Duration (minutes)<input id="wd" type="number" value="60"></label><br><label>Level<select id="wl">${Object.keys(EXERCISE_SEED).map(x=>`<option>${x}</option>`).join('')}</select></label><br><button class="primary" onclick="saveNewWorkout()">Create workout</button>`)}function saveNewWorkout(){let n=wn.value.trim();if(!n)return alert('Enter a workout name.');let w={id:'w'+Date.now(),name:n,type:wt.value,duration:+wd.value||60,level:wl.value,ex:exFor((S.workouts||[]).length,wt.value,wl.value).map(e=>({name:e[0],sets:e[1],reps:e[2]})),seed:false};S.workouts??=[];S.workouts.push(w);save();myGym()}function removeGymWorkout(){let arr=S.workouts||[];show('🗑️ Remove workout',arr.length?arr.map((w,i)=>`<div class="choice between"><span><b>${esc(w.name)}</b><br><span class="small">${esc(w.type||'Gym')} · ${esc(w.level||'Intermediate')}</span></span><button class="danger" onclick="deleteWorkout(${i})">Remove</button></div>`).join(''):'<p class="muted">No saved workouts.</p>')}function deleteWorkout(i){let w=S.workouts[i];if(w?.seed)return alert('Starter workouts are protected. You can remove workouts you add yourself.');if(confirm('Remove this workout?')){S.workouts.splice(i,1);save();removeGymWorkout()}}function exercisePool(mode,level){let pool=(S.exerciseIndex?.[level]||[]).filter(e=>mode==='Cardio'?e.kind==='Cardio':e.kind==='Gym');return pool.length?pool:(S.exerciseIndex?.[level]||[])}function exFor(i,mode=S.s.gymType||'Gym',level=S.s.gymAbility||'Getting back into fitness'){let pool=exercisePool(mode,level),selected=[];let count=mode==='Cardio'?3:5;for(let j=0;j<Math.min(count,pool.length);j++)selected.push(pool[(i*3+j)%pool.length]);return selected.map(e=>[e.name,e.sets,e.reps])}function exerciseIndex(){show('📚 Exercise Index',`<p class="small">50 seeded exercises per ability level. Add more whenever you like.</p><div class="row">${Object.keys(S.exerciseIndex||{}).map(l=>`<button onclick="showExerciseLevel('${l}')">${esc(l)}</button>`).join('')}</div><button onclick="addExercise()">➕ Add exercise</button>`)}function showExerciseLevel(level){show('🏋️ '+esc(level),`<input id="exq" placeholder="Search exercises..." oninput="renderExerciseLevel('${level}')"><div id="exList"></div><button onclick="addExercise('${level}')">➕ Add exercise</button>`);renderExerciseLevel(level)}function renderExerciseLevel(level){let q=(exq?.value||'').toLowerCase();let arr=(S.exerciseIndex[level]||[]).filter(x=>(x.name+' '+x.focus+' '+x.equipment+' '+x.kind).toLowerCase().includes(q));exList.innerHTML=arr.map(x=>`<div class="choice"><b>${esc(x.name)}</b><div class="small">${esc(x.kind)} · ${esc(x.focus)} · ${esc(x.equipment)} · ${x.sets} × ${x.reps}</div><div class="row"><button onclick="editExercise('${level}','${x.id}')">Edit</button><button class="danger" onclick="delExercise('${level}','${x.id}')">Delete</button></div></div>`).join('')}function addExercise(level='Getting back into fitness',x=null){x=x||{id:'e'+Date.now(),name:'',focus:'Full body',equipment:'Machine',sets:2,reps:10,kind:'Gym',level};show('🏋️ Exercise',`<label>Name<input id="en" value="${esc(x.name)}"></label><br><label>Focus<input id="ef" value="${esc(x.focus)}"></label><br><label>Equipment<input id="eeq" value="${esc(x.equipment)}"></label><br><label>Sets<input id="eset" type="number" value="${x.sets}"></label><br><label>Reps/min<input id="erep" type="number" value="${x.reps}"></label><br><label>Type<select id="ekind"><option ${x.kind==='Gym'?'selected':''}>Gym</option><option ${x.kind==='Cardio'?'selected':''}>Cardio</option></select></label><br><button class="primary" onclick="saveExercise('${level}','${x.id}')">Save</button>`)}function saveExercise(level,id){let x={id,name:en.value.trim(),focus:ef.value.trim()||'Full body',equipment:eeq.value.trim()||'Other',sets:+eset.value||2,reps:+erep.value||10,kind:ekind.value,level,seed:false};if(!x.name)return;S.exerciseIndex[level]??=[];if(S.exerciseIndex[level].some(a=>a.id===id))S.exerciseIndex[level]=S.exerciseIndex[level].map(a=>a.id===id?x:a);else S.exerciseIndex[level].push(x);save();dlg.close();showExerciseLevel(level)}function editExercise(level,id){addExercise(level,S.exerciseIndex[level].find(x=>x.id===id))}function delExercise(level,id){let x=S.exerciseIndex[level].find(a=>a.id===id);if(x?.seed)return alert('Starter exercises are protected. You can remove exercises you add yourself.');if(confirm('Delete this exercise?')){S.exerciseIndex[level]=S.exerciseIndex[level].filter(a=>a.id!==id);save();renderExerciseLevel(level)}}function serviceWorkoutIndex(){let service=S.s.service||'Royal Navy';show('⚓ '+esc(service)+' Service Day',`<p class="small">10 starter service-day workouts. Choose one for today, then add your own later.</p>${(S.serviceWorkouts||[]).map((w,i)=>`<div class="choice"><b>${esc(w.name)}</b><div class="small">${w.items.length} movements · approx. 30–45 min</div><button class="warn" onclick="startServiceWorkout('${service}',${i})">Choose</button></div>`).join('')}<button onclick="addServiceWorkout()">➕ Add service workout</button>`)}function startServiceWorkout(service,i){let w=S.serviceWorkouts[i],mapped=w.items.map(name=>{let found=null;for(const lev of Object.keys(S.exerciseIndex||{})){found=(S.exerciseIndex[lev]||[]).find(e=>e.name===name);if(found)break}return found?{name:found.name,sets:found.sets,reps:found.reps}:{name,sets:2,reps:10}});show('⚓ '+esc(service)+' · '+esc(w.name),mapped.map(e=>`<div class="check"><div><b>${esc(e.name)}</b><div class="small">${e.sets} sets × ${e.reps} reps/min</div></div></div>`).join('')+`<button class="primary" onclick="dlg.close()">Done</button>`)}function addServiceWorkout(){show('⚓ New service workout',`<label>Name<input id="sn" placeholder="e.g. Shipboard Conditioning"></label><br><label>Exercises (comma separated)<input id="si" placeholder="Leg Press, Chest Press, Plank"></label><br><button class="primary" onclick="saveServiceWorkout()">Save</button>`)}function saveServiceWorkout(){let n=sn.value.trim(),items=si.value.split(',').map(x=>x.trim()).filter(Boolean);if(!n||!items.length)return alert('Enter a name and at least one exercise.');S.serviceWorkouts.push({id:'s'+Date.now(),name:n,items,seed:false});save();dlg.close();serviceWorkoutIndex()}function workout(k,i){let d=day(k),ex=S.plan?.gym?.[k]?.ex||exFor(i),done=d.wdone||{};let rows=ex.map((e,j)=>`<div class="check"><input type="checkbox" ${done[j]?'checked':''} onchange="toggleEx('${k}',${j},${ex.length})"><div><b>${esc(e[0])}</b><div class="small">${e[1]} sets × ${e[2]} reps/min</div></div></div>`).join('');show('🏋️ '+esc(S.plan?.gym?.[k]?.name||'Gym Session'),`<p class="small">Complete all required items; the final one marks the gym session complete.</p>${rows}<div class="row"><button onclick="reduced('${k}')">⚓ ${esc(S.s.reduced)}</button><button onclick="extra('${k}')">➕ Add extra</button><button onclick="workoutFeedback('${k}')">💬 How did it feel?</button><button onclick="off('${k}')">💤 Today off</button></div>`)}function toggleEx(k,j,total){let d=day(k);d.wdone??={};d.wdone[j]=!d.wdone[j];if(Object.values(d.wdone).filter(Boolean).length===total)d.gym='full';save();workout(k,0)}
function workoutFeedback(k){show('💬 How did it feel?',`<p class="small">This helps you learn what works for the next block.</p><div class="row"><button onclick="saveFeedback('${k}','Too easy')">😴 Too easy</button><button onclick="saveFeedback('${k}','Good')">🙂 Good</button><button onclick="saveFeedback('${k}','Challenging')">💪 Challenging</button><button onclick="saveFeedback('${k}','Very hard')">🥵 Very hard</button></div>`)}function saveFeedback(k,v){day(k).feedback=v;save();dlg.close();render()}function extra(k){let all=Object.values(S.exerciseIndex||{}).flat();show('➕ Extra exercise',`<label>Exercise<select id="ee">${all.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></label><br><label>Sets<input id="es" type="number" value="3"></label><br><label>Reps/min<input id="er" type="number" value="10"></label><button class="primary" onclick="saveExtra('${k}')">Add</button>`)}function saveExtra(k){day(k).extra.push({name:ee.value,sets:+es.value,reps:+er.value});save();dlg.close();render()}
function reduced(k){let html=RED.map((r,i)=>`<div class="choice"><b>⚓ ${esc(r[0])}</b><div class="small">${esc(r[1])} · ${r[2]} min</div><button class="warn" onclick="startRed('${k}',${i})">Choose</button></div>`).join('');show('⚓ Choose '+esc(S.s.reduced),html+`<button onclick="addReduced()">➕ Create reduced workout</button>`)}function startRed(k,i){let r=RED[i];day(k).red={name:r[0],items:r[3],done:{}};redWorkout(k,r)}function redWorkout(k,r){let d=day(k),done=d.red.done,rows=r[3].map((n,i)=>`<div class="check"><input type="checkbox" ${done[i]?'checked':''} onchange="toggleRed('${k}',${i},${r[3].length},${RED.indexOf(r)})"><div><b>${esc(n)}</b><div class="small">Light / reduced effort</div></div></div>`).join('');show('⚓ '+esc(S.s.reduced)+' · '+esc(r[0]),rows+`<button onclick="extra('${k}')">➕ Add extra exercise</button>`)}function toggleRed(k,i,total,ri){let d=day(k);d.red.done[i]=!d.red.done[i];if(Object.values(d.red.done).filter(Boolean).length===total)d.gym='reduced';save();redWorkout(k,RED[ri])}function addReduced(){alert('In V2.1 we can make the Reduced Workout Library fully editable. For now the starter library is ready to test.')}function off(k){day(k).gym='off';day(k).checks.gym=false;save();dlg.close();render()}
function pickWorkout(type,level,idx){let pool=(S.workouts||[]).filter(w=>w.type===type&&w.level===level);if(!pool.length)pool=(S.workouts||[]).filter(w=>w.type===type);return pool.length?pool[idx%pool.length]:null}function genGym(){let n=S.s.gym,rest=7-n,days=n===5?[0,1,2,3,4]:n===4?[0,1,3,5]:n===3?[0,2,4]:n===2?[1,4]:[2],mode=S.s.gymType||'Both',focus=S.s.gymAbility||'Getting back into fitness',dur=S.s.session||'60 minutes';let html=`<div class="notice">${n} training days + ${rest} rest days · ${esc(dur)} sessions · ${esc(mode)} · Gym: ${esc(focus)} · Cardio: ${esc(S.s.cardio)}</div><p>Suggested training days: ${days.map(i=>DAYS[i]).join(' · ')}</p><p class="small">The generator selects from the seeded workout library using your Gym/Cardio focus and ability settings.</p><button class="primary" onclick='acceptGym(${JSON.stringify(days)})'>Accept 4-week plan</button>`;show('🤖 Gym Plan Preview',html)}function acceptGym(days){S.plan??={name:'Current 4-Week Plan',diet:{},gym:{}};for(let w=0;w<4;w++)for(let i=0;i<7;i++){let d=new Date(monday(today()));d.setDate(d.getDate()+w*7+i);let k=iso(d);if(days.includes(i)){let idx=days.indexOf(i),type=S.s.gymType==='Both'?(idx%2===0?'Gym':'Cardio'):S.s.gymType,lev=type==='Cardio'?S.s.cardio:S.s.gymAbility,candidate=pickWorkout(type,lev,w*days.length+idx),ex=candidate?candidate.ex.map(e=>[e.name,e.sets,e.reps]):exFor(idx,type,lev);S.plan.gym[k]={name:candidate?.name||`${type} ${['A','B','C','D','E'][idx%5]}`,ex}}}save();dlg.close();nav('gym')}function genDiet(){let need=S.rep.map(r=>{let n=Object.values(r.days||{}).reduce((a,x)=>a+x.length,0)*4;return`${esc(r.brand)} ${esc(r.product)}: ${n} required / ${r.remaining} available`}).join('<br>')||'No meal replacements configured.';show('🤖 Diet Plan Preview',`<div class="notice">Scheduled replacements are placed first; remaining meals are selected from your 50-meal My Menu database.</div><p>${need}</p><p>Target: <b>${S.s.kcal} kcal/day</b>.</p><button class="primary" onclick="acceptDiet()">Accept plan</button>`)}function acceptDiet(){S.plan??={name:'Current 4-Week Plan',diet:{},gym:{}};for(let w=0;w<4;w++)for(let i=0;i<7;i++){let d=new Date(monday(today()));d.setDate(d.getDate()+w*7+i);let k=iso(d);S.plan.diet[k]={};CATS.forEach(c=>{let r=S.rep.find(x=>x.days[c]?.includes(DAYS[i]));if(r)S.plan.diet[k][c]={name:r.brand+' '+r.product,kcal:+r.kcal,type:'rep',rep:r.id,items:[{name:r.brand+' '+r.product,kcal:+r.kcal}]};else{let pool=S.menu.filter(x=>x.cat===c);if(pool.length){let x=pool[(w*7+i*3)%pool.length];S.plan.diet[k][c]={name:x.name,kcal:x.kcal,type:'menu',id:x.id,items:[{name:x.name,kcal:+x.kcal}]}}}})}save();dlg.close();nav('diet')}
function weekPage(){let ds=week(),kg=0,full=0,red=0;let rows=ds.map((d,i)=>{let k=iso(d),x=day(k),c=consumed(k),ok=c>0&&c<=S.s.kcal;if(ok)kg++;if(x.gym==='full')full++;if(x.gym==='reduced')red++;return`<div class="day"><b>${DAYS[i].slice(0,3)}</b><div>🔥 Kcal ${c?(ok?'✅ Within target':'⚠️ Over target'):'— Not logged'}<br>🏋️ Gym ${x.gym==='full'?'✅ Full':x.gym==='reduced'?'⚓ '+esc(S.s.reduced):x.gym==='off'?'💤 Day off':'—'}<br>⚓ Reduced ${x.gym==='reduced'?'✅ Used':'—'}</div><span class="badge">${Object.values(x.checks).filter(Boolean).length}/7</span></div>`}).join('');app.innerHTML=`<div class="card"><h2>📅 Week Overview</h2><div class="grid"><div class="stat"><b>${kg}/7</b><span>Days within kcal</span></div><div class="stat"><b>${full}/${S.s.gym}</b><span>Full gym sessions</span></div><div class="stat"><b>${red}</b><span>${esc(S.s.reduced)} used</span></div></div></div><div class="card"><h2>Daily overview</h2>${rows}</div><div class="positive"><b>⭐ Weekly reflection</b><p>${weekMsg(full,red,kg)}</p></div>`}function weekMsg(full,red,kg){if(full>=S.s.gym)return'Great week — you hit your planned full training target. Keep that consistency going.';if(full+red>=S.s.gym)return'You adapted well this week and kept your training frequency going, including reduced sessions when needed.';if(kg>=5)return'Your nutrition was consistent on most days. One imperfect day does not undo the work you have put in.';return'This is a learning week. You kept showing up where you could; use what you learned to make the next week easier.'}
function progressPage(){let last=S.weights.length?S.weights[S.weights.length-1].weight:S.s.weight,first=S.weights.length?S.weights[0].weight:S.s.weight,diff=first-last,ds=week(),full=ds.filter(d=>day(iso(d)).gym==='full').length,red=ds.filter(d=>day(iso(d)).gym==='reduced').length;app.innerHTML=`<div class="card"><h2>📈 Progress</h2><div class="grid"><div class="stat"><b>${last.toFixed(1)} kg</b><span>Current weight</span></div><div class="stat"><b>${S.s.goal.toFixed(1)} kg</b><span>Target weight</span></div><div class="stat"><b>${diff>=0?'−':'+'}${Math.abs(diff).toFixed(1)} kg</b><span>Since first weigh-in</span></div></div><button class="primary" style="margin-top:10px" onclick="addWeight()">⚖️ Add new weight</button></div><div class="card"><h2>🏋️ Gym progress</h2><div class="grid"><div class="stat"><b>${full}/${S.s.gym}</b><span>Full sessions</span></div><div class="stat"><b>${red}</b><span>${esc(S.s.reduced)}</span></div><div class="stat"><b>${S.weights.length}</b><span>Weigh-ins</span></div></div></div><div class="positive"><b>⭐ Progress so far</b><p>${progressMsg(first,last)}</p></div><div class="card"><h2>Weight history</h2>${S.weights.length?S.weights.map(w=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--l)"><span>${new Date(w.date).toLocaleDateString('en-GB')}</span><b>${w.weight.toFixed(1)} kg</b></div>`).join(''):'<p class="muted">No weigh-ins yet. Add one when you are ready, especially at the end of a four-week cycle.</p>'}</div>`}function progressMsg(a,b){if(!S.weights.length)return'Your first weigh-in will give us a useful starting point. The bigger goal is building a routine you can keep.';if(b<a)return`You are ${ (a-b).toFixed(1)} kg down since your first weigh-in. That is movement in the right direction — keep focusing on consistency.`;if(b===a)return`Your weight is steady so far, but you are building the habits that matter. The scale is only one measure of progress.`;return`The scale is up ${ (b-a).toFixed(1)} kg since the first entry. Keep working the routine and review the trend rather than judging one measurement.`}function addWeight(){show('⚖️ Add new weight',`<p class="small">A simple weigh-in at the end of a four-week cycle is enough if that suits you.</p><input id="nw" type="number" step="0.1" value="${S.s.weight}"><button class="primary" onclick="saveWeight()">Save weight</button>`)}function saveWeight(){let w=+nw.value;if(!w)return;S.weights.push({date:iso(today()),weight:w});S.s.weight=w;save();dlg.close();render()}
function settingsPage(){let s=S.s;app.innerHTML=`<div class="card"><h2>⚙️ Settings</h2><p class="muted">Your control centre for goals, training, service settings and four-week plans.</p></div><div class="card"><h2>🎯 My Goals</h2><div class="goal-grid"><div class="goal-item"><div><span class="small">Current weight</span><b>${s.weight.toFixed(1)} kg</b></div><button onclick="edit('weight')">✏️ Edit</button></div><div class="goal-item"><div><span class="small">Goal weight</span><b>${s.goal.toFixed(1)} kg</b></div><button onclick="edit('goal')">✏️ Edit</button></div><div class="goal-item"><div><span class="small">Daily calorie target</span><b>${s.kcal} kcal/day</b></div><button onclick="edit('kcal')">✏️ Edit</button></div></div><p class="small">These values are shown throughout the app. Change them here when your goals change.</p></div><div class="card"><h2>🏋️ Training Preferences</h2><label>Training days per week<select onchange="S.s.gym=+this.value;save();render()">${[1,2,3,4,5,6,7].map(n=>`<option ${s.gym===n?'selected':''}>${n}</option>`).join('')}</select></label><br><div class="notice">Rest days: <b>${7-s.gym}</b></div><br><label>Session duration<select onchange="S.s.session=this.value;save();render()">${['20','30','45','60','75','90'].map(n=>`<option ${String(s.session).startsWith(n)?'selected':''}>${n} minutes</option>`).join('')}</select></label><br><label>Training focus<select onchange="S.s.gymType=this.value;save();render()"><option ${s.gymType==='Gym'?'selected':''}>Gym</option><option ${s.gymType==='Cardio'?'selected':''}>Cardio</option><option ${s.gymType==='Both'?'selected':''}>Both</option></select></label><br><label>Gym ability<select onchange="S.s.gymAbility=this.value;save();render()">${['Getting back into fitness','Beginner','Intermediate','Advanced'].map(x=>`<option ${s.gymAbility===x?'selected':''}>${x}</option>`).join('')}</select></label><br><label>Cardio ability<select onchange="S.s.cardio=this.value;save();render()">${['Getting back into fitness','Beginner','Intermediate','Advanced'].map(x=>`<option ${s.cardio===x?'selected':''}>${x}</option>`).join('')}</select></label><br><label>Primary training goal<select onchange="S.s.goalType=this.value;save();render()">${['Lose weight','General fitness','Build strength','Improve cardio','Maintain fitness','Get back into fitness'].map(x=>`<option ${s.goalType===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="card"><h2>⚓ Service / Reduced Workout</h2><label>Service<select onchange="S.s.service=this.value;save();render()"><option ${s.service==='Royal Navy'?'selected':''}>Royal Navy</option><option ${s.service==='Royal Air Force'?'selected':''}>Royal Air Force</option><option ${s.service==='British Army'?'selected':''}>British Army</option><option ${s.service==='Royal Marines'?'selected':''}>Royal Marines</option><option ${s.service==='Other'?'selected':''}>Other</option></select></label><br><label>Reduced workout name<input value="${esc(s.reduced)}" onchange="S.s.reduced=this.value||'Reduced Day';save();render()"></label><br><label>Default duration<input type="number" value="${s.reducedMins}" onchange="S.s.reducedMins=+this.value||30;save()"></label></div><div class="card"><h2>🥗 Diet Preferences</h2><p>Main meals: <b>3</b> · Snacks: <b>1</b></p><button onclick="nav('diet')">Manage meal replacements & menus</button></div><div class="card"><h2>📚 Database Library</h2><p class="small">My Menu: <b>${S.menu.length}</b> · Food: <b>${S.food.length}</b> · Gym exercises: <b>${Object.values(S.exerciseIndex||{}).reduce((n,a)=>n+a.length,0)}</b> · Workout routines: <b>${S.workouts.length}</b></p><div class="row"><button onclick="nav('diet')">Open Diet Indexes</button><button onclick="nav('gym')">Open Gym Library</button></div></div><div class="card"><h2>📋 Four-Week Plans</h2><p>${S.plan?'Current plan created':'No current plan yet'}</p><div class="row"><button onclick="genDiet()">🤖 Generate diet</button><button onclick="genGym()">🤖 Generate gym</button><button onclick="newBlock()">🔄 Start new 4-week block</button></div></div><div class="card"><h2>💾 Backup & Data</h2><div class="row"><button onclick="exportData()">📤 Export</button><button onclick="importData()">📥 Import</button><button class="danger" onclick="resetData()">Reset app</button></div></div><div class="card"><h2>ℹ️ About</h2><p class="small">FORCESFIT V4.2 · expanded meal, food and workout databases.</p></div>`}
function newBlock(){if(confirm('Start a new four-week block? Your history and saved databases will remain, while the current plan is cleared.')){S.plan=null;Object.keys(S.days).forEach(k=>{S.days[k].gym=null;S.days[k].wdone={};S.days[k].red=null;});save();render();alert('New four-week block ready. You can now generate a fresh diet and gym plan.')}}
function edit(f){let map={weight:['Current weight','number'],goal:['Goal weight','number'],kcal:['Daily calorie target','number'],gym:['Gym days per week','number'],session:['Preferred session','text'],experience:['Training experience','text'],cardio:['Cardio ability','text']},x=map[f],v=S.s[f];show('⚙️ '+x[0],`<input id="ev" type="${x[1]}" value="${esc(v)}"><button class="primary" onclick="saveEdit('${f}')">Save</button>`)}function saveEdit(f){let v=ev.value;S.s[f]=['weight','goal','kcal'].includes(f)||['gym'].includes(f)?+v:v;save();dlg.close();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='forcesfit-backup.json';a.click()}function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Backup imported.')}catch(e){alert('Invalid backup.')}};r.readAsText(i.files[0])};i.click()}function resetData(){if(confirm('Reset all app data on this device?')){S=fresh();save();render()}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===S.tab));({today:todayPage,diet:dietPage,gym:gymPage,week:weekPage,progress:progressPage,settings:settingsPage}[S.tab]||todayPage)()}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw-v4.js').catch(()=>{});render();
</script></body></html>
